# Public chain data looks like "keys" to generic rules. Allow only public 20-byte
# addresses and the one known event topic hash. 32-byte values are still scanned.
[extend]
useDefault = true

[[allowlists]]
description = "public 20-byte EVM addresses"
regexes = ['''^0x[0-9a-fA-F]{40}$''']

[[allowlists]]
description = "Pons TokenLaunched event topic (public)"
condition = "AND"
paths = ['''src/adapters/pons\.ts''']
regexes = ['''^0x8d4aad4953d0ca700d468f3753aa14432d1b35b43ec6409f051fb6aa43a89607$''']
